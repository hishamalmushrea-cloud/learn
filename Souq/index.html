<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b45309" />
  <meta name="description" content="موسوعة لغة السوق والبائع والزبون — دليل شامل لعبارات وأساليب البيع والجذب والتفاوض في الأسواق العربية." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="موسوعة السوق" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>موسوعة السوق</title>
</head>
<body>
  <div id="app">
    <!-- شاشة البداية -->
    <div id="splash" class="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 200 200" width="120" height="120" aria-hidden="true">
          <defs>
            <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#fbbf24"/>
              <stop offset="100%" stop-color="#b45309"/>
            </linearGradient>
          </defs>
          <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#sg)"/>
          <!-- واجهة المحل -->
          <rect x="46" y="78" width="108" height="74" rx="6" fill="#fff7ed"/>
          <!-- المظلة المخططة -->
          <path d="M40 78 L100 50 L160 78 Z" fill="#0f766e"/>
          <path d="M40 78 q15 -16 30 0 q15 -16 30 0 q15 -16 30 0 q15 -16 30 0 L160 78 Z" fill="#fef3c7"/>
          <!-- الباب -->
          <rect x="88" y="104" width="24" height="48" rx="3" fill="#b45309"/>
          <!-- نجمة/عملة -->
          <circle cx="100" cy="128" r="9" fill="#fbbf24"/>
          <text x="100" y="133" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e">س</text>
        </svg>
      </div>
      <h1 class="splash-title">موسوعة السوق</h1>
      <p class="splash-sub">لغة البائع والزبون في الأسواق العربية</p>
      <div class="splash-loader"><span></span></div>
    </div>

    <!-- الترويسة -->
    <header class="app-header" id="appHeader" hidden>
      <button id="menuBtn" class="icon-btn" aria-label="القائمة">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div class="header-title">
        <h1 id="sectionTitle">موسوعة السوق</h1>
      </div>
      <div class="header-actions">
        <button id="textSizeBtn" class="icon-btn" aria-label="حجم الخط">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 4v3h5v12h3V7h5V4H9zm-6 8h3v7h3v-7h3V9H3v3z"/></svg>
        </button>
        <button id="themeBtn" class="icon-btn" aria-label="الوضع الليلي">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
        <button id="installBtn" class="icon-btn install-btn" hidden aria-label="تثبيت التطبيق">
          <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 3a1 1 0 011 1v9.59l3.3-3.3a1 1 0 111.4 1.42l-5 5a1 1 0 01-1.4 0l-5-5a1 1 0 111.4-1.42l3.3 3.3V4a1 1 0 011-1zM4 19a1 1 0 011-1h14a1 1 0 110 2H5a1 1 0 01-1-1z"/></svg>
        </button>
      </div>
    </header>

    <!-- القائمة الجانبية -->
    <div id="drawerOverlay" class="drawer-overlay" hidden></div>
    <nav id="drawer" class="drawer" hidden>
      <div class="drawer-header">
        <svg viewBox="0 0 200 200" width="48" height="48">
          <defs><linearGradient id="sg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/></linearGradient></defs>
          <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#sg2)"/>
          <rect x="46" y="78" width="108" height="74" rx="6" fill="#fff7ed"/>
          <path d="M40 78 L100 50 L160 78 Z" fill="#0f766e"/>
          <path d="M40 78 q15 -16 30 0 q15 -16 30 0 q15 -16 30 0 q15 -16 30 0 L160 78 Z" fill="#fef3c7"/>
          <rect x="88" y="104" width="24" height="48" rx="3" fill="#b45309"/>
        </svg>
        <div>
          <h2>موسوعة السوق</h2>
          <p>دليل لغة البائع والزبون</p>
        </div>
      </div>
      <ul id="navList" class="nav-list"></ul>
      <div class="drawer-footer">
        <div style="display:flex;gap:10px;justify-content:center;margin-bottom:10px;">
          <button id="exportData" class="btn-primary" style="padding:8px 12px;font-size:12px;">تصدير المفضلة</button>
          <input type="file" id="importDataFile" accept=".json" hidden>
        </div>
        <button id="resetFavs" class="text-btn">مسح المفضلة</button>
        <p class="version">الإصدار 1.0 — يعمل بدون إنترنت</p>
      </div>
    </nav>

    <!-- المحتوى -->
    <main id="content" class="content" hidden></main>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav" id="bottomNav" hidden>
      <button class="nav-tab active" data-route="home">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
        <span>الرئيسية</span>
      </button>
      <button class="nav-tab" data-route="chapters">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 4h7v16H4zm9 0h7v16h-7zM6 7h3v2H6zm9 0h3v2h-3z"/></svg>
        <span>الأقسام</span>
      </button>
      <button class="nav-tab" data-route="phrases">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 6h16v3H4zm0 5h16v3H4zm0 5h10v3H4z"/></svg>
        <span>العبارات</span>
      </button>
      <button class="nav-tab" data-route="languages">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 2a10 10 0 100 20 10 10 0 000-20zm7.4 9h-3.1a15.4 15.4 0 00-1.3-5.3A8.03 8.03 0 0119.4 11zM12 4c.9 1.5 1.7 3.6 2 7H10c.3-3.4 1.1-5.5 2-7zM4.6 13h3.1c.2 1.9.7 3.7 1.3 5.3A8.03 8.03 0 014.6 13zm3.1-2H4.6A8.03 8.03 0 019 5.7 15.4 15.4 0 007.7 11zM12 20c-.9-1.5-1.7-3.6-2-7h4c-.3 3.4-1.1 5.5-2 7zm3.3-1.7c.6-1.6 1.1-3.4 1.3-5.3h3.1a8.03 8.03 0 01-4.4 5.3z"/></svg>
        <span>اللغات</span>
      </button>
    </nav>

    <!-- زر العودة للأعلى -->
    <button id="toTop" class="to-top" hidden aria-label="الأعلى">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7.4 15.4L12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg>
    </button>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
