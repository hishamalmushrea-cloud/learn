name: Android quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-and-domain:
    name: Content, curriculum and learning engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install standalone Kotlin compiler
        run: |
          mkdir -p /tmp/kt
          npm install --prefix /tmp/kt kotlin-compiler@2.2.20
      - name: Run deep content and domain quality gate
        env:
          KOTLIN_BIN: /tmp/kt/node_modules/kotlin-compiler/bin
        run: ./tools/verify_all.sh

  android-build:
    name: Android build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: IndoLearn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test and lint
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-failure-reports
          if-no-files-found: ignore
          path: |
            IndoLearn/app/build/reports/
            IndoLearn/app/build/test-results/
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: indolearn-debug-apk
          path: IndoLearn/app/build/outputs/apk/debug/*.apk
